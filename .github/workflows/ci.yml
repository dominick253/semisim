name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

# The runner image is pinned, not ubuntu-latest. GitHub is migrating the
# ubuntu-latest label from Ubuntu 24.04 to Ubuntu 26.04 between 2026-10-19 and
# 2026-11-19, and a label that changes underneath a phase gate is how a green
# main branch turns red mid phase. ubuntu-24.04 is the image every green run in
# this repo was measured on. Action versions are pinned to exact tags for the
# same reason.
jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      # Pinned to the same gdtoolkit the workspace contract uses, so a formatter
      # release cannot redden main.
      - name: Install gdtoolkit
        run: python -m pip install --no-cache-dir gdtoolkit==4.5.0

      - name: Format check
        run: gdformat --check scripts tests

      - name: Lint
        run: gdlint scripts tests/unit tests/sim

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download Godot
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip
          bin="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          test -x "$bin" || chmod +x "$bin"
          echo "GODOT=${GITHUB_WORKSPACE}/${bin}" >> "$GITHUB_ENV"
          ./"$bin" --version

      # Software rasterizer only: the CPU-only rule in AGENTS.md applies here too,
      # and a runner has no GPU anyway.
      # The import step used to print ERROR lines and still exit 0, which is how
      # the missing boot.tscn defect survived: a green job with errors in it.
      # A33 requires an import step with no ERROR line, so the log is gated.
      - name: Import project
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          timeout 300 "$GODOT" --headless --path . --import 2>&1 | tee import.log
          if grep -q "^ERROR" import.log; then
            echo "IMPORT_ERROR: the import step printed errors"
            grep "^ERROR" import.log
            exit 1
          fi

      - name: GUT unit suite
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          timeout 900 "$GODOT" --headless --path . \
            -s res://addons/gut/gut_cmdln.gd \
            -gdir=res://tests/unit \
            -ginclude_subdirs \
            -gexit

      - name: Headless smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          timeout 300 "$GODOT" --headless --path . tests/sim/smoke_controls.tscn \
            | tee smoke.log
          grep -q "SMOKE OK" smoke.log

      # A14: the golden determinism harness. Runs the fixed 600-step scripted
      # drive twice in one process and gates on the in-process transform
      # envelope (Jolt is not bit-deterministic, see DEVIATIONS D58). Prints the
      # two hashes, the envelope, and the final state to the log. Kept under the
      # same timeout pattern as the sim steps above.
      - name: Golden determinism (A14)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          timeout 300 "$GODOT" --headless --path . tests/sim/golden_run.tscn \
            | tee golden.log
          grep -q "RESULT = PASS" golden.log
          grep -E "hash|envelope|out_of_bounds|run[0-9] speed|RESULT" golden.log
